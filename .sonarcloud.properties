# Configuración de SonarQube Cloud Automatic Analysis (un solo proyecto para
# todo el central). El CI no corre su propio scanner: Sonar rechaza el
# análisis desde CI mientras Automatic Analysis está activo. La cobertura no
# viene de Sonar: la mide el PR score sobre las líneas cambiadas.
#
# Se excluye lo generado (contrato Prisma emitido por `npm run contract:emit`),
# lo construido y las dependencias: no es código para corregir a mano.
sonar.exclusions=backend/src/prisma/contract.d.ts,backend/src/prisma/contract.json,**/.next/**,**/dist/**,**/coverage/**,**/node_modules/**
