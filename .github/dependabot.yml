version: 2
updates:
  - package-ecosystem: "npm"
    directories: ["/admin", "/backend", "/e-com", "/landing"]
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directories: ["/", "/admin", "/backend", "/e-com", "/landing"]
    schedule:
      interval: "weekly"
