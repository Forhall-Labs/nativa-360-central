name: CI

# Quality gates de cada PR contra main (trunk-based: es la única rama). Los
# checks requeridos en la protección de main son "CI ok" y "PR score":
#
# - checks: los checks de cada proyecto que el PR toca (format, spell, lint,
#   tests con cobertura, build; en backend además audit, e2e y Docker).
# - snyk: dependencias, código y la imagen del backend.
# - PR score: nota de 0 a 100 con SonarQube Cloud + cobertura de las líneas
#   cambiadas (scripts/pr-score/, docs/PR_SCORE.md). Mínimo 80.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detectar proyectos tocados
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.diff.outputs.projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar deploy-flags.json
        run: |
          jq -e '
            (keys | sort) == ["admin", "backend", "e-com", "landing"] and
            all(.[]; . == "dev" or . == "prod")
          ' deploy-flags.json > /dev/null || {
            echo "::error::deploy-flags.json debe tener exactamente admin, backend, e-com y landing, cada uno con \"dev\" o \"prod\"."
            exit 1
          }

      - name: Diff contra main
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE...$HEAD")
          projects=$(for p in admin backend e-com landing; do
            grep -q "^$p/" <<<"$changed" && echo "$p" || true
          done | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Proyectos tocados: $projects"

  checks:
    name: ${{ matrix.project }}
    needs: changes
    if: needs.changes.outputs.projects != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fails on high/critical)
        if: matrix.project == 'backend'
        run: npm run audit

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Spell check
        run: npm run spell

      - name: Lint
        run: npm run lint

      - name: Tests con cobertura
        run: npm run test:cov

      - name: Subir cobertura para el PR score
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project }}
          path: ${{ matrix.project }}/coverage/lcov.info
          if-no-files-found: error
          retention-days: 3

      - name: Build (includes type-check)
        run: npm run build
        env:
          # Placeholders para los proyectos Next.js (ver ci-cd.yml de cada
          # uno); el backend los ignora.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: E2E tests
        if: matrix.project == 'backend'
        run: npm run test:e2e

      - name: Docker build
        if: matrix.project == 'backend'
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: nativa-360-backend:ci

  snyk:
    name: Snyk (${{ matrix.scan }})
    # Se activa con la variable de repo SNYK_ENABLED=true y el secret
    # SNYK_TOKEN. Los PRs desde forks no tienen el secret: se saltan.
    if: >-
      vars.SNYK_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scan: [dependencies, code, container]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
        with:
          snyk-version: v1.1308.2

      # Snyk corre sin umbral para que el reporte (que el PR score usa en
      # su desglose) tenga todas las severidades; el gate lo decide jq:
      # falla con al menos una medium, high o critical.
      - name: Scan dependencies (package-lock.json de los 4 proyectos)
        if: matrix.scan == 'dependencies'
        run: |
          mkdir -p snyk-reports
          snyk test --all-projects --json-file-output=snyk-reports/snyk-dependencies.json || [ $? -eq 1 ]
          jq -e '[(if type == "array" then .[] else . end) | .vulnerabilities[]?
                  | select(.severity == "medium" or .severity == "high" or .severity == "critical")]
                 | length == 0' snyk-reports/snyk-dependencies.json > /dev/null
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Scan source code
        if: matrix.scan == 'code'
        run: |
          mkdir -p snyk-reports
          snyk code test --sarif-file-output=snyk-reports/snyk-code.sarif || [ $? -eq 1 ]
          jq -e '[.runs[]?.results[]? | select(.level == "error" or .level == "warning")]
                 | length == 0' snyk-reports/snyk-code.sarif > /dev/null
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Build backend runtime image
        if: matrix.scan == 'container'
        run: docker build --tag nativa-360-backend:ci backend

      - name: Scan backend runtime image
        if: matrix.scan == 'container'
        run: |
          mkdir -p snyk-reports
          snyk container test nativa-360-backend:ci --file=backend/Dockerfile \
            --json-file-output=snyk-reports/snyk-container.json || [ $? -eq 1 ]
          jq -e '[., (.applications[]?) | .vulnerabilities[]?
                  | select(.severity == "medium" or .severity == "high" or .severity == "critical")]
                 | length == 0' snyk-reports/snyk-container.json > /dev/null
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Subir reporte para el desglose del PR score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-${{ matrix.scan }}
          path: snyk-reports/
          if-no-files-found: ignore
          retention-days: 3

  ci-ok:
    name: CI ok
    needs: [changes, checks, snyk]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultados
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

  pr-score:
    name: PR score
    needs: [changes, checks, snyk]
    # always(): si un job previo falla, este igual corre y falla con el
    # motivo — un check requerido "skipped" contaría como aprobado.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # El diff contra main necesita el historial de ambos lados.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Test the score calculation
        run: node --test scripts/pr-score/score.test.mjs scripts/pr-score/breakdown.test.mjs

      - name: Descargar cobertura de los proyectos tocados
        if: needs.checks.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports

      - name: Descargar reportes de Snyk
        if: needs.snyk.result == 'success' || needs.snyk.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: snyk-*
          path: snyk-reports
          merge-multiple: true

      - name: Compute and publish the score
        run: node scripts/pr-score/index.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_DIR: coverage-reports
          SNYK_DIR: snyk-reports
          NEEDS: ${{ toJSON(needs) }}
          # Checks externos a este workflow que también tienen que pasar.
          REQUIRED_CHECKS: |
            SonarCloud Code Analysis
