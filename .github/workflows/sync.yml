name: Sync y deploy

# Trunk-based: cada merge a main del central publica cada carpeta en el main
# de su repo individual (`git subtree split`) y dispara allá el deploy al
# ambiente que diga deploy-flags.json ("dev" o "prod").
#
# El split es determinístico (reproduce los commits originales con los mismos
# SHA), así que el push siempre es fast-forward y nunca se reescribe
# historial. Si alguien commiteó directo en un repo individual, el push se
# rechaza y el job falla — nunca se fuerza.
#
# Se despliega un proyecto cuando su código cambió o cuando cambió su flag
# (pasar "dev" → "prod" sin tocar código promueve lo que ya está en main).
# Correrlo a mano (Run workflow) despliega los 4 según sus flags.
#
# Requiere el secret SYNC_TOKEN: fine-grained PAT de un admin de la org
# (resource owner Forhall-Labs) con acceso a los 4 repos y permisos
# Contents, Workflows y Actions en Read and write. Tiene que ser de un admin
# porque main de los repos individuales está protegido y solo los admins lo
# saltan (enforce_admins está apagado).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: ${{ matrix.dir }} → ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: admin, repo: nativa-360-admin, workflow: ci-cd.yml }
          - { dir: backend, repo: nativa-360-backend, workflow: ci.yml }
          - { dir: e-com, repo: nativa-360-e-com, workflow: ci-cd.yml }
          - { dir: landing, repo: nativa-360-lading, workflow: ci-cd.yml }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Sin esto el GITHUB_TOKEN queda como header de auth y pisa al
          # SYNC_TOKEN al pushear al otro repo.
          persist-credentials: false

      - name: Split, push y deploy
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          DIR: ${{ matrix.dir }}
          REPO: ${{ matrix.repo }}
          WORKFLOW: ${{ matrix.workflow }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Falta el secret SYNC_TOKEN (ver comentario al inicio de sync.yml)."
            exit 1
          fi

          target=$(jq -r --arg p "$DIR" '.[$p] // empty' deploy-flags.json)
          case "$target" in
            dev|prod) ;;
            *) echo "::error::deploy-flags.json: \"$DIR\" tiene que ser \"dev\" o \"prod\" (tiene \"$target\")."; exit 1 ;;
          esac
          previous_target=$(git show "$BEFORE:deploy-flags.json" 2>/dev/null \
            | jq -r --arg p "$DIR" '.[$p] // empty' 2>/dev/null || true)

          remote="https://x-access-token:${SYNC_TOKEN}@github.com/Forhall-Labs/${REPO}.git"
          sha=$(git subtree split --prefix="$DIR" HEAD)
          remote_sha=$(git ls-remote "$remote" refs/heads/main | cut -f1)

          if ! git push "$remote" "$sha:refs/heads/main"; then
            echo "::error::Push rechazado en $REPO@main. Si es non-fast-forward, alguien commiteó directo en el repo individual: traé ese cambio al central con 'git subtree pull --prefix=$DIR https://github.com/Forhall-Labs/$REPO.git main' (en un PR) y volvé a correr este workflow."
            exit 1
          fi
          echo "### $DIR → $REPO@main: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

          if [ "$EVENT" != "workflow_dispatch" ] && [ "$sha" = "$remote_sha" ] && [ "$target" = "$previous_target" ]; then
            echo "Sin cambios de código ni de flag en $DIR — no se despliega."
            exit 0
          fi
          gh workflow run "$WORKFLOW" --repo "Forhall-Labs/$REPO" --ref main \
            -f target="$target" -f sha="$sha"
          echo "Deploy a **$target** disparado: https://github.com/Forhall-Labs/$REPO/actions/workflows/$WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
