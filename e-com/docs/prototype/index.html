<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tienda · Nativa 360</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      Prototipo navegable del comercio electrónico de Nativa 360.
      Sigue ../ui-spec.md y cubre HU-02 a HU-07 y HU-22 a HU-26 (../user-stories.md).
      Pantallas: catálogo, detalle, carrito, checkout, pedido registrado,
      mis pedidos, ingreso y registro. Los datos son de ejemplo y el carrito,
      la sesión y los pedidos se guardan en el navegador.
      Cuenta de prueba: ana@correo.com / nativa360. Estado de error: ?demo=error.
    -->

    <!-- Íconos y empaques reutilizables -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-search" viewBox="0 0 24 24">
        <path d="M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14z" />
        <path d="m20 20-4-4" />
      </symbol>
      <symbol id="i-cart" viewBox="0 0 24 24">
        <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2" />
        <path d="M10 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2z" />
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24">
        <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" />
        <path d="M4 21a8 8 0 0 1 16 0" />
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10" /></symbol>
      <symbol id="i-store" viewBox="0 0 24 24">
        <path d="M4 10v10h16V10M3 4h18l-1 6H4z" />
        <path d="M9 20v-6h6v6" />
      </symbol>
      <symbol id="i-truck" viewBox="0 0 24 24">
        <path d="M3 6h11v10H3zM14 10h4l3 3v3h-7" />
        <path d="M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" />
      </symbol>
      <symbol id="i-chat" viewBox="0 0 24 24">
        <path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.6L3 21l1.9-5.7A8.4 8.4 0 1 1 21 11.5z" />
      </symbol>
      <symbol id="i-leaf" viewBox="0 0 24 24">
        <path d="M5 20c0-9 6-15 15-16-1 10-7 16-15 16zm0 0c3-4 6-7 10-9" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <path d="M12 3 2 20h20zM12 10v4M12 17h.01" />
      </symbol>
      <symbol id="i-box" viewBox="0 0 24 24">
        <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24">
        <path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" />
      </symbol>

      <!-- Empaques: el color sale de la variable --art en cada uso -->
      <symbol id="art-frasco" viewBox="0 0 120 160">
        <rect x="34" y="8" width="52" height="22" rx="6" fill="#1b2b44" />
        <rect x="22" y="30" width="76" height="122" rx="20" fill="var(--art)" />
        <rect x="22" y="30" width="18" height="122" rx="9" fill="#fff" opacity=".18" />
        <rect x="22" y="66" width="76" height="58" rx="6" fill="#fff" />
      </symbol>
      <symbol id="art-bolsa" viewBox="0 0 120 160">
        <path d="M26 18h68l8 128a8 8 0 0 1-8 8H26a8 8 0 0 1-8-8z" fill="var(--art)" />
        <rect x="26" y="18" width="68" height="12" fill="#000" opacity=".12" />
        <rect x="24" y="62" width="72" height="62" rx="6" fill="#fff" />
      </symbol>
      <symbol id="art-caja" viewBox="0 0 120 160">
        <path d="M24 40 44 22h68L92 40z" fill="var(--art)" opacity=".7" />
        <path d="m92 40 20-18v112l-20 18z" fill="var(--art)" opacity=".85" />
        <rect x="24" y="40" width="68" height="112" rx="4" fill="var(--art)" />
        <rect x="30" y="70" width="56" height="56" rx="6" fill="#fff" />
      </symbol>
      <symbol id="art-gotero" viewBox="0 0 120 160">
        <rect x="48" y="4" width="24" height="26" rx="10" fill="#1b2b44" />
        <rect x="42" y="28" width="36" height="14" rx="4" fill="#33465f" />
        <rect x="28" y="42" width="64" height="110" rx="18" fill="var(--art)" />
        <rect x="28" y="72" width="64" height="54" rx="6" fill="#fff" />
      </symbol>
      <symbol id="art-tubo" viewBox="0 0 120 160">
        <rect x="44" y="124" width="32" height="28" rx="4" fill="#1b2b44" />
        <path d="M30 10h60l-8 116H38z" fill="var(--art)" />
        <rect x="30" y="10" width="60" height="8" fill="#000" opacity=".12" />
        <rect x="38" y="48" width="44" height="52" rx="6" fill="#fff" />
      </symbol>
    </svg>

    <a class="skip" href="#app">Saltar al contenido</a>

    <header class="topbar">
      <div class="wrap topbar__row">
        <a class="brand" href="#/" aria-label="Nativa 360, inicio de la tienda">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="20" fill="currentColor" />
              <path
                d="M13 27c0-8 5-14 15-15-1 9-6 15-15 15Zm0 0c3-4 6-7 10-9"
                fill="none"
                stroke="#fff"
                stroke-width="2.2"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="brand__name">Nativa<span>360</span></span>
          <span class="brand__tag">Tienda</span>
        </a>

        <form class="search" role="search" data-search-form>
          <label class="visually-hidden" for="buscar">Buscar productos</label>
          <svg class="ic"><use href="#i-search" /></svg>
          <input
            id="buscar"
            name="buscar"
            type="search"
            placeholder="Buscar vitaminas, tés, superalimentos…"
            autocomplete="off"
            maxlength="100"
          />
        </form>

        <nav class="topbar__actions" aria-label="Cuenta y carrito">
          <a class="action" href="#/ingresar" data-account-link>
            <svg class="ic"><use href="#i-user" /></svg>
            <span data-account-label>Ingresar</span>
          </a>
          <a class="action action--cart" href="#/carrito" aria-label="Carrito">
            <svg class="ic"><use href="#i-cart" /></svg>
            <span class="action__label">Carrito</span>
            <span class="badge" data-cart-count aria-live="polite">0</span>
          </a>
        </nav>
      </div>
    </header>

    <main id="app" class="wrap" tabindex="-1"></main>

    <footer class="foot">
      <div class="wrap foot__row">
        <p>
          <strong>Nativa 360</strong> · 50 m este de la Municipalidad de Pérez Zeledón · Tel.
          2771-1234
        </p>
        <a href="../../../landing/docs/prototype/index.html">Volver al sitio principal</a>
      </div>
    </footer>

    <div class="toast" role="status" aria-live="polite" data-toast hidden></div>

    <script src="app.js"></script>
  </body>
</html>
