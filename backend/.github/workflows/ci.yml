name: CI

# Este repo se actualiza desde Forhall-Labs/nativa-360-central (trunk-based:
# solo main). No recibe PRs ni pushes directos: el sync del central pushea a
# main y dispara este workflow con el ambiente que diga el feature flag
# deploy-flags.json del central — dev → servicio develop de Render, prod →
# producción. Los quality gates (CI, Snyk, SonarQube Cloud, PR score) corren
# en los PRs del central; acá se repiten los checks como última barrera
# antes del deploy, que solo corre si pasan.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Ambiente destino
        type: choice
        options: [dev, prod]
        required: true
      sha:
        description: Commit de main a desplegar
        type: string
        required: true

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Audit, format, spell, lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fails on high/critical)
        run: npm run audit

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Spell check
        run: npm run spell

      - name: Lint
        run: npm run lint

      - name: Build (includes type-check)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: nativa-360-backend:ci

  deploy:
    name: Deploy (${{ inputs.target }})
    needs: [checks, docker]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'production' || 'develop' }}
    steps:
      # El deploy hook hace que Render construya el último commit de la rama
      # que tiene configurada el servicio: los dos servicios (develop y
      # producción) tienen que apuntar a main.
      - name: Trigger Render deploy hook
        env:
          HOOK_URL: ${{ inputs.target == 'prod' && secrets.RENDER_DEPLOY_HOOK_URL_PRODUCTION || secrets.RENDER_DEPLOY_HOOK_URL_DEVELOP }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::Secret del deploy hook de Render para ${{ inputs.target }} no configurado — se salta el deploy. Configurar RENDER_DEPLOY_HOOK_URL_PRODUCTION (prod) o RENDER_DEPLOY_HOOK_URL_DEVELOP (dev) en Settings -> Secrets and variables -> Actions, con la URL de Render Dashboard -> servicio -> Settings -> Deploy Hook."
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL"
